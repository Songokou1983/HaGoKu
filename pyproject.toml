[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hagokyu"
version = "0.1.0"
description = "用数学的力量，挖出数据背后真正的信息"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "HaGoKu Team" },
]
keywords = ["data-analysis", "multi-agent", "statistics", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Agent framework
    "crewai>=0.100.0",
    # Structured output
    "pydantic>=2.0",
    "instructor>=1.0",
    # CLI
    "click>=8.0",
    # Data
    "pandas>=2.0",
    "duckdb>=1.0",
    "pyarrow>=14.0",
    "openpyxl",
    "pypdf",
    "python-docx",
    # Statistics
    "pingouin>=0.5",
    "statsmodels>=0.14",
    "scipy>=1.12",
    # ML
    "scikit-learn>=1.4",
    "flaml>=2.0",
    # Cleaning & validation
    "pyod>=1.1",
    "cleanlab>=2.0",
    "great-expectations>=1.0",
    # Profiling
    "ydata-profiling>=4.0",
    "missingno>=0.5",
    # Visualization
    "plotly>=5.0",
    "matplotlib>=3.8",
    # Reporting
    "jinja2>=3.1",
    # LLM
    "openai>=1.0",
    "langchain-openai>=0.1.0",
    # UI
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
pdf = [
    "weasyprint",
]

[project.scripts]
hagokyu = "hagokyu.cli:main"
hagokyu-ui = "hagokyu.ui.app:main"

# 打包示例数据
[tool.hatch.build.targets.wheel]
packages = ["examples"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
