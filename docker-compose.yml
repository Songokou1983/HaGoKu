# HaGoKu Studio — 本地开发与部署（Docker Compose）
# 启动: docker compose up -d
# 关闭: docker compose down
# 日志: docker compose logs -f api

services:
  # ==== API 后端 ====
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hagoku-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HAGOKYU_WORK_DIR=/data/hagoku
      - HAGOKYU_PROJECT_DIR=/data/hagoku/projects
    volumes:
      - hagoku_data:/data/hagoku # 持久化项目文件、记忆、知识库
      - ./hagoku:/app/hagoku:ro  # 热加载代码（只读），适合开发
      - ./hagoku/agents:/app/hagoku/agents:ro
      - ./hagoku/tools:/app/hagoku/tools:ro
      - ./hagoku/manager:/app/hagoku/manager:ro
      - ./hagoku/storage:/app/hagoku/storage:ro
      - ./hagoku/guardrails:/app/hagoku/guardrails:ro
      - ./hagoku/llm:/app/hagoku/llm:ro
      - ./hagoku/observability:/app/hagoku/observability:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hagoku-net

  # ==== Web 前端（开发模式）====
  web:
    build:
      context: ./hagoku_web
      dockerfile: Dockerfile
    container_name: hagoku-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./hagoku_web/src:/app/src:ro
      - ./hagoku_web/public:/app/public:ro
      - ./hagoku_web/index.html:/app/index.html:ro
      - ./hagoku_web/vite.config.ts:/app/vite.config.ts:ro
      - ./hagoku_web/tailwind.config.js:/app/tailwind.config.js:ro
      - ./hagoku_web/postcss.config.js:/app/postcss.config.js:ro
      - ./hagoku_web/tsconfig.json:/app/tsconfig.json:ro
      - ./hagoku_web/tsconfig.app.json:/app/tsconfig.app.json:ro
    depends_on:
      - api
    networks:
      - hagoku-net

  # ==== 可选：向量数据库（知识库后端）====
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: hagoku-chromadb
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - chromadb_data:/chroma/chroma
  #   environment:
  #     - IS_PERSISTENT=TRUE
  #     - ANONYMIZED_TELEMETRY=FALSE
  #   networks:
  #     - hagoku-net

volumes:
  hagoku_data:
    driver: local
  # chromadb_data:
  #   driver: local

networks:
  hagoku-net:
    driver: bridge