<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景圆（数据/分析隐喻） -->
  <circle cx="32" cy="32" r="30" fill="#1e1040"/>
  <circle cx="32" cy="32" r="28" fill="#2d1b69" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- 9 的上半部分：三条增长柱状图（数据洞察隐喻） -->
  <!-- 最低柱 -->
  <rect x="16" y="18" width="6" height="12" rx="1.5" fill="#06b6d4"/>
  <!-- 中等柱 -->
  <rect x="25" y="12" width="6" height="18" rx="1.5" fill="#22d3ee"/>
  <!-- 最高柱 -->
  <rect x="34" y="6" width="6" height="24" rx="1.5" fill="#a78bfa"/>

  <!-- 9 的下半部分：圆弧曲线（数据环形隐喻） -->
  <!-- 圆弧主体 -->
  <path d="M37,28 Q37,42 32,47 Q27,52 19,52 Q11,52 11,43"
        stroke="#a78bfa" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- 圆点 -->
  <circle cx="11" cy="43" r="4" fill="#a78bfa"/>

  <!-- 右上角小数据点（星星效果） -->
  <circle cx="50" cy="16" r="2.5" fill="#fbbf24"/>
  <circle cx="46" cy="22" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="53" cy="23" r="1.5" fill="#fbbf24" opacity="0.5"/>
</svg>
