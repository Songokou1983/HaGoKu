<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00997a"/>
    </linearGradient>
  </defs>
  <!-- bg -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- chart bars -->
  <rect x="80" y="280" width="52" height="152" rx="8" fill="url(#accent)" opacity="0.5"/>
  <rect x="152" y="180" width="52" height="252" rx="8" fill="url(#accent)" opacity="0.7"/>
  <rect x="224" y="230" width="52" height="202" rx="8" fill="url(#accent)" opacity="0.6"/>
  <rect x="296" y="120" width="52" height="312" rx="8" fill="url(#accent)"/>
  <rect x="368" y="200" width="52" height="232" rx="8" fill="url(#accent)" opacity="0.65"/>
  <!-- sparkline -->
  <polyline points="80,130 130,110 180,160 230,90 280,140 330,70 380,120 420,60"
    fill="none" stroke="#00d4aa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- dots on sparkline -->
  <circle cx="330" cy="70" r="8" fill="#00d4aa"/>
  <circle cx="420" cy="60" r="8" fill="#00d4aa"/>
  <!-- H initial mark -->
  <text x="440" y="470" font-family="sans-serif" font-size="48" font-weight="bold" fill="#00d4aa" opacity="0.3">H</text>
</svg>
