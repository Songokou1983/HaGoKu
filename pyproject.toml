[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hagoku"
version = "2.3.1"
description = "让每个小模型，都能做专业级商业分析"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Songokou1983" },
]
keywords = ["data-analysis", "multi-agent", "statistics", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/Songokou1983/HaGoKu"
Issues = "https://github.com/Songokou1983/HaGoKu/issues"
Documentation = "https://github.com/Songokou1983/HaGoKu/blob/master/PROJECT.md"

dependencies = [
    # Structured output
    "pydantic>=2.0",
    "instructor>=1.0",
    # CLI
    "click>=8.0",
    # Data
    "pandas>=2.0",
    "pyarrow>=14.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.0",
    # Statistics
    "pingouin>=0.5",
    "statsmodels>=0.14",
    "scipy>=1.12",
    # ML
    "scikit-learn>=1.4",
    # Cleaning & validation
    # Profiling
    "ydata-profiling>=4.0",
    # Visualization
    "plotly>=5.0",
    "matplotlib>=3.8",
    # Reporting
    "jinja2>=3.1.3",
    # LLM
    "openai>=1.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "ruff",
    "mypy",
]
pdf = [
    "weasyprint",
]

[project.scripts]
hagoku = "hagoku.cli:main"
hagoku-api = "hagoku.api.server:main"

# wheel / sdist 打包：hagoku 包 + examples 目录
[tool.hatch.build.targets.wheel]
packages = ["hagoku", "examples"]

# sdist 打包：同上
[tool.hatch.build.targets.sdist]
packages = ["hagoku", "examples"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true